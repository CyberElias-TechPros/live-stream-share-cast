name: Deploy Cloudflare Worker API

# Production deployment is deliberately separate from the pull-request quality
# gate. It runs only after a push to main and requires explicit production
# configuration; no wildcard/local origin or development secret is accepted.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   JWT_SECRET, CLEANUP_TOKEN, ALLOWED_ORIGINS, APP_URL, WORKER_URL
#
# One-time Cloudflare setup:
#   npx wrangler d1 create live-stream-db
#   npx wrangler r2 bucket create lsc-recordings
#   npx wrangler r2 bucket create lsc-avatars
#   npx wrangler secret put JWT_SECRET --env production
#   npx wrangler secret put CLEANUP_TOKEN --env production

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'worker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install web dependencies
        working-directory: .
        run: npm ci

      - name: Verify web artifact
        working-directory: .
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Install Worker dependencies
        run: npm ci

      - name: Verify Worker
        run: |
          npm run typecheck
          npm run db:migrate:local
          npm audit --omit=dev --audit-level=high

      - name: Validate production configuration
        run: npm run validate:production
        env:
          ENVIRONMENT: production
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLEANUP_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          APP_URL: ${{ secrets.APP_URL }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply live-stream-db --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: |
          npx wrangler deploy --env production \
            --var "ALLOWED_ORIGINS:${ALLOWED_ORIGINS}" \
            --var "APP_URL:${APP_URL}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          APP_URL: ${{ secrets.APP_URL }}

      - name: Verify health
        run: |
          test -n "$WORKER_URL" || { echo "::error::WORKER_URL is not configured"; exit 1; }
          body="$(curl --fail --silent --show-error "$WORKER_URL/api/health")"
          echo "$body"
          echo "$body" | grep -q '"database":"ok"' || { echo "::error::worker health check failed"; exit 1; }
          echo "$body" | grep -q '"configurationIssues":\[\]' || { echo "::error::production configuration is incomplete"; exit 1; }
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
