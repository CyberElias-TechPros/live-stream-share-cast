name: Verify web and Worker

on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  worker:
    name: Worker quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate:local

  android:
    name: Android compile gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$sdkmanager_path" ]; then
            echo "sdkmanager was not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and run Android unit tests
        shell: bash
        run: |
          set +e
          gradle -p android testDebugUnitTest assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "## Android compile diagnostics" >> "$GITHUB_STEP_SUMMARY"
            tail -200 "$RUNNER_TEMP/android-build.log" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              case "$line" in
                *"e: "*|*"error:"*|*"FAILURE"*|*"Could not resolve"*|*"Could not find"*|*"Could not GET"*|*"Could not HEAD"*|*"Failed to"*|*"What went wrong"*|*"PKIX"*|*"SSL"*)
                  safe=${line//'%'/'%25'}
                  safe=${safe//$'\r'/'%0D'}
                  safe=${safe//$'\n'/'%0A'}
                  echo "::error file=android,title=Gradle compile::$safe"
                  ;;
              esac
            done < "$RUNNER_TEMP/android-build.log"
          fi
          exit "$status"

  api:
    name: API and realtime smoke
    needs: worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run db:migrate:local
      - name: Start local Worker
        run: |
          npm run dev > "$RUNNER_TEMP/worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/worker.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/worker.log"
          exit 1
      - run: npm run test:api
      - run: npm run test:realtime
      - if: always()
        run: |
          if [ -f "$RUNNER_TEMP/worker.pid" ]; then kill "$(cat "$RUNNER_TEMP/worker.pid")" || true; fi
          cat "$RUNNER_TEMP/worker.log" || true
