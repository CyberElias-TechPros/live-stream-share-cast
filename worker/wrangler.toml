# I'm Live — Cloudflare Worker configuration
# Deploy: npx wrangler deploy   (after `wrangler d1 create imlive` and filling database_id)

name = "imlive-api"
main = "src/index.ts"
compatibility_date = "2025-05-25"
compatibility_flags = ["nodejs_compat"]

# Serve the built frontend from the same Worker (single-origin mode).
# Point directory at the built frontend output. When deploying the frontend to
# Vercel instead, remove this block and set PUBLIC_URL + ALLOWED_ORIGINS.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Every request passes through the Worker first: it handles /api/* and
# /sitemap.xml itself and delegates everything else to the asset layer so
# documents get security headers (CSP) applied.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "imlive"
database_id = "00000000-0000-0000-0000-000000000000" # wrangler d1 create imlive
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Hourly maintenance: expire recordings, prune stats/attempts/sessions.
[triggers]
crons = ["17 * * * *"]

# Optional: cloud recording storage. Uncomment after `wrangler r2 bucket create imlive-recordings`.
# [[r2_buckets]]
# binding = "RECORDINGS"
# bucket_name = "imlive-recordings"

[vars]
# Comma-separated list of origins allowed to call the API with credentials.
# "*" allows any origin (fine for development; restrict in production).
ALLOWED_ORIGINS = "*"
# Public base URL of the frontend, used for canonical URLs/sitemap/emails.
# Leave empty to derive from the request.
PUBLIC_URL = ""
# Force the deployment mode: "lan" or "cloud". Empty = auto-detect from the
# request host (private/loopback/.local hosts → lan, which disables internet
# STUN ice servers so everything works offline on a local network).
DEPLOY_MODE = ""
# Optional TURN server for WebRTC behind symmetric NATs, e.g. "turn:turn.example.com:3478"
TURN_URL = ""
TURN_USERNAME = ""
TURN_CREDENTIAL = ""
